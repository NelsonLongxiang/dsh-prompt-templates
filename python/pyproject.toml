[build-system]
requires = ["hatchling==1.30.1"]
build-backend = "hatchling.build"

[project]
name = "dsh-prompt-templates-backend"
version = "0.1.0"
description = "Quick prompt-template backend for the dsh-prompt-templates plugin (CLI + SQLite + stdio JSON-RPC)"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
  "pydantic>=2.12,<3",
  "sqlalchemy>=2.0",
  "typer>=0.12",
]

[dependency-groups]
test = ["pytest>=8"]

[project.urls]
Homepage = "https://github.com/NelsonLongXiang/dsh-prompt-templates"
Source = "https://github.com/NelsonLongXiang/dsh-prompt-templates"

[project.scripts]
dsh-prompt-templates = "dsh_prompt_templates.cli:main"

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["src/dsh_prompt_templates"]
