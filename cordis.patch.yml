# dsh-prompt-templates bundle patch: mounts the prompt-templates plugin into
# the host composition of a dsh profile. The plugin registers its
# /plugins/dsh-prompt-templates routes into the shared web server and its
# settings namespace into the shared settings document, so it needs no realm.
#
# Install: `dsh plugin --profile <name> add <this package>` (npm, a local
# path, or Git). The `dsh plugin` command pnpm-installs the package into the
# profile and reconciles it into the profile's `dsh.profile.bundles` layer
# list.
#
# The Python backend child runs through `uv run --project <pkg>/python`:
# `uv` lazily creates and syncs the package-local venv on first spawn, so no
# separate bootstrap step has to have run inside the installed copy (a
# `file:` install never executes `prepare`). The patch JS sandbox exposes
# `process` and `baseUrl` (the profile directory, whose node_modules holds
# the installed package) — `require`/`__dirname` are not available there.
- insert:
    # Shared Python bridge service used by this and other Python-backed plugins.
    - id: python-bridge
      name: '@nelsonlongxiang/dsh-python-bridge'

    - id: prompt-templates
      # Node-resolvable package name — must stay in sync with package.json
      # `name`. Quoted because `@` is a reserved YAML indicator.
      name: '@nelsonlongxiang/dsh-prompt-templates'
      config:
        # The Python backend child: uv-managed package venv running the
        # extracted template backend's serve command.
        command: !!js >
          process.platform === 'win32'
            ? ['uv', 'run', '--project', process.getBuiltinModule('node:url').fileURLToPath(new URL('node_modules/@nelsonlongxiang/dsh-prompt-templates/python', baseUrl)), 'python', '-m', 'dsh_prompt_templates.cli', 'serve']
            : ['uv', 'run', '--project', process.getBuiltinModule('node:url').fileURLToPath(new URL('node_modules/@nelsonlongxiang/dsh-prompt-templates/python', baseUrl)), 'python', '-m', 'dsh_prompt_templates.cli', 'serve']
        # Explicit SQLite database path so persistence lands under
        # $DSH_HOME/ext/prompt-templates/ regardless of cwd or environment drift.
        dbPath: !!js >
          `${(process.env.DSH_HOME ?? `${process.getBuiltinModule('node:os').homedir()}/.dsh`).replace(/\\/g, '/')}/ext/prompt-templates/db.sqlite3`
